name: GitHub-Profile-3D-Contrib

on:
  schedule:
    - cron: "0 18 * * *"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    name: generate-github-profile-3d-contrib
    steps:
      - uses: actions/checkout@v4
      - uses: yoshi389111/github-profile-3d-contrib@latest
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          USERNAME: ${{ github.repository_owner }}
      - name: Optimize SVGs
        run: |
          npm install -g svgo
          svgo profile-3d-contrib/*.svg
      - name: Add rounded corners to SVG
        run: |
          python3 - <<'EOF'
          import re, glob

          for svg_path in glob.glob("profile-3d-contrib/*.svg"):
              with open(svg_path, "r", encoding="utf-8") as f:
                  content = f.read()

              # Convert background <path d="M0 0h{w}v{h}H0z" ...> to <rect width="{w}" height="{h}" rx="20" ry="20" ...>
              # This cleanly gives the SVG rounded corners without clip-paths.
              new_content = re.sub(
                  r'<path d="M0 0h(\d+)v(\d+)H0z"([^>]*?)/>',
                  r'<rect width="\1" height="\2" rx="15" ry="15"\3/>',
                  content
              )

              # Check for alternative background path format (sometimes generated by svgo)
              if new_content == content:
                  new_content = re.sub(
                      r'<path d="M0 0h(\d+)v(\d+)H0z"([^>]*?)></path>',
                      r'<rect width="\1" height="\2" rx="15" ry="15"\3></rect>',
                      content
                  )

              with open(svg_path, "w", encoding="utf-8") as f:
                  f.write(new_content)
              
              if new_content != content:
                  print(f"Applied rounded corners to {svg_path}")
              else:
                  print(f"Could not find background path in {svg_path}")
          EOF

      - name: Commit & Push
        run: |
          git config user.name github-actions
          git config user.email github-actions@github.com
          git add -A .
          if [ -n "$(git status --porcelain)" ]; then
            git commit -m "generated 3D contribution graph"
            git push
          else
            echo "No changes to commit"
          fi
